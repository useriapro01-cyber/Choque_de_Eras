# Config do projeto Supabase (CLI). Fonte de verdade versionada.
# project_id = ref do projeto (público — já aparece na URL e em config.public.json).
project_id = "gyyrumqcphdgqovyzlsk"

# ----------------------------------------------------------------------------
# Edge Function submit-daily — verify_jwt = FALSE
# ----------------------------------------------------------------------------
# Dois motivos: (1) o preflight CORS (OPTIONS vem SEM Authorization) precisa
# responder os headers de Allow-*; com verify_jwt=true a plataforma o barra.
# (2) TDMV-8: o ranking é por E-MAIL, sem conta/sessão/JWT — a função é chamada
# com a anon key e faz a própria validação. O endpoint é ABERTO de propósito; a
# proteção é rate-limit (por e-mail E por IP) + duplo opt-in (nada entra no
# ranking sem o clique no link) + replay (ninguém forja score). Deploy:
# `supabase functions deploy submit-daily` lê este flag.
[functions.submit-daily]
verify_jwt = false
